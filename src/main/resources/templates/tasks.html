<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Tracker Catalog</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { text-decoration: none; padding: 5px 10px; background-color: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background-color: #dc3545; }
    </style>
</head>
<body>
    <h1>Task Management System</h1>
    <a th:href="@{/tasks/new}" class="btn">+ Add New Task</a>

    <div th:if="${#lists.isEmpty(tasks)}" style="margin-top: 20px;">
        <p>No tasks currently available.</p>
    </div>

    <table th:if="${!#lists.isEmpty(tasks)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Completed</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}">1</td>
                <td th:text="${task.title}">Sample Title</td>
                <td th:text="${task.description}">Sample Description</td>
                <td th:text="${task.priority}">1</td>
                <td th:text="${task.completed ? 'Yes' : 'No'}">No</td>
                <td>
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}">Edit</a> | 
                    <a th:href="@{/tasks/{id}/delete(id=${task.id})}" onclick="return confirm('Delete this task?');">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
