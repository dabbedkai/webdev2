<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .card { border: 1px solid #ccc; padding: 1.5rem; max-width: 400px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Product Details</h1>
    <div class="card">
        <p><strong>ID:</strong> <span th:text="${product.id}">1</span></p>
        <p><strong>Name:</strong> <span th:text="${product.name}">Item Name</span></p>
        <p><strong>Category:</strong> <span th:text="${product.category}">Category</span></p>
        <p><strong>Price:</strong> <span th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</span></p>
        <p><strong>Stock Level:</strong> <span th:text="${product.stock}">0</span></p>
    </div>
    <br>
    <a th:href="@{/products}">Back to Catalog</a>
</body>
</html>
